name: Release candidate

on:
  push:
    branches:
      - "release-candidate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spellbook-public-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore release downloads
        id: cache
        uses: ./.github/actions/releaseCache
        timeout-minutes: 2
        continue-on-error: true
      - name: Discard incomplete cache restore
        if: steps.cache.outcome == 'failure'
        shell: pwsh
        run: node scripts/releaseCache/cacheSettings.mjs --clear all
      - name: Require production Server URL
        shell: pwsh
        env:
          SPELLBOOK_SERVER_URL: ${{ vars.SPELLBOOK_SERVER_URL }}
        run: |
          if (-not $env:SPELLBOOK_SERVER_URL) { throw 'PRODUCTION_CONFIG_MISSING' }
      - name: Install and validate candidate
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run version:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned installer and checksums
        shell: pwsh
        env:
          SPELLBOOK_SERVER_URL: ${{ vars.SPELLBOOK_SERVER_URL }}
        run: |
          npm run app:dist -- --publish never "--config.electronDownload.cache=$env:electron_config_cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:checksums
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Syft
        shell: pwsh
        run: >-
          node scripts/installVerifiedTool.mjs
          --url https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_windows_amd64.zip
          --sha256 5e4bc3e6b6344b4625de0f7aa5351aaa72856d11d78462972de0a101ee2c1c8f
          --output "$env:RUNNER_TEMP/syft"
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: >-
          & "$env:RUNNER_TEMP/syft/syft.exe"
          "dir:release/win-unpacked"
          -o "cyclonedx-json=release/SpellBook-SBOM.cdx.json"
      - name: Upload exact release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spellbook-windows-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/SpellBook-Setup-*.exe
            release/SpellBook-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/SpellBook-SBOM.cdx.json
            LICENSE.md
            NOTICE.md
            THIRD_PARTY_NOTICES.md
